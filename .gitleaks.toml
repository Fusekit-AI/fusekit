[extend]
useDefault = true

[[allowlists]]
description = "Ignore local FuseKit runtime state and development caches."
paths = [
  '''^\.fusekit/''',
  '''^\.venv/''',
  '''(^|/)__pycache__/''',
  '''^build/''',
  '''^dist/''',
  '''^\.mypy_cache/''',
  '''^\.pytest_cache/''',
  '''^\.ruff_cache/''',
]
